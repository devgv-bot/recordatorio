<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Recordatorios Web</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginDiv">
    <h2>Iniciar sesión</h2>
    <input type="text" id="username" placeholder="Usuario"><br>
    <input type="password" id="password" placeholder="Contraseña"><br>
    <button onclick="login()">Ingresar</button>
    <div id="loginMsg" style="color:red; margin-top:10px;"></div>
  </div>

  <!-- APP -->
  <div id="appDiv" style="display:none;">
    <h1>Recordatorios de <span id="userLabel"></span></h1>
    <div class="task-input">
      <input type="text" id="taskInput" placeholder="Ej: Revisar correos">
      <button class="add-btn" onclick="addTask()">Agregar</button>
    </div>
    <ul id="taskList"></ul>
  </div>

</div>

<script src="js/app.js"></script>
</body>
</html>
